
# fics_uci.py v0.2.2 | prioridad: CLI > config.yml > defaults
ip: 192.168.68.117
port: 6210
ip_fics: freechess.org
port_fics: 5000
user: guest
password: ""
accept: true
rated: true
unrated: true
# Tipos FICS: standard, blitz, lightning, untimed.
# Alias aceptados: classical -> standard; bullet -> lightning.
types: [standard, blitz, lightning]
min_time: 0
max_time: 180
max_increment: 180
movetime: 0
connect_timeout: 15
engine_timeout: 90
seek_timeout: 15
seek_retry: 60

# Milisegundos desde el fin de una partida hasta admitir otra; -1 desactiva la espera.
throtle: 60000
verbose: false

# Usuarios excluidos (comparacion insensible a mayusculas/minusculas).
no-accept:
  - GriffySr
  - GriffyJr
no-request: 
  - GriffySr
  - GriffyJr

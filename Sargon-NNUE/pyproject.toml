[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sargon-nnue"
version = "0.6.0"
description = "Modular Sargon chess engine with pluggable evaluators and players"
requires-python = ">=3.10"
dependencies = [
  "chess==1.11.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
gui = ["pygame>=2.5"]
test = ["pytest>=8"]

[project.scripts]
sargon-gui = "sargon_nnue.sargon_gui:main"
sargon-selfplay = "sargon_nnue.sargon_selfplay:main"
sargon-train = "sargon_nnue.sargon_train:main"
sargon-listen = "sargon_nnue.sargon_listen:main"

[tool.setuptools.packages.find]
where = ["src"]

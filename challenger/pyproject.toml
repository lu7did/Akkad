[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "challenger-chess"
version = "0.1.0"
description = "Standalone Sargon chess bot/controller using a TCP UCI opponent"
requires-python = ">=3.10"
dependencies = ["chess==1.11.2"]

[project.scripts]
challenger = "challenger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
